name: Build & Deploy QGIS Plugin Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Genera plugins.xml e index.html
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python build.py

      - name: Prepara la cartella del sito
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp plugins.xml index.html _site/ 2>/dev/null || true
          cp -r icons _site/ 2>/dev/null || true
          cp *.zip _site/ 2>/dev/null || true

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
